<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#120F24" />
    <meta name="description" content="작은 빛으로, 마을을 되찾아요." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23120F24'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23FFC857' opacity='.25'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23FFC857' stroke='%233A2A1E' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23FFF1C9'/%3E%3C/svg%3E"
    />
    <title>라이트 디펜스</title>
    <!--
      스플래시: 스크립트·폰트가 오기 전부터 바로 보이도록 여기 직접 그린다.
      불러오기 진행은 src/ui/Splash.ts가 채우고, 그림을 다 불러오면 사라진다.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120f24;
      }
      .splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f6f1e7;
        font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, sans-serif;
        background: #120f24;
        transition: opacity 0.6s ease-out;
      }
      .splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      /* 홈 그림을 흐리고 어둡게: 그림이 아직 안 왔으면 남색 */
      .splash__bg {
        position: absolute;
        inset: -24px;
        background:
          radial-gradient(60% 40% at 50% 46%, rgba(255, 200, 87, 0.22), rgba(255, 200, 87, 0) 70%),
          linear-gradient(to bottom, rgba(18, 15, 36, 0.55), rgba(18, 15, 36, 0.92)),
          url('/assets/backgrounds/home.webp') 32% 50% / cover no-repeat;
        filter: blur(10px) saturate(0.9);
      }
      .splash__inner {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 14px;
        width: min(82vw, 360px);
        text-align: center;
      }
      .splash__lantern {
        width: 96px;
        height: 132px;
        filter: drop-shadow(0 0 28px rgba(255, 200, 87, 0.55));
      }
      .splash__flame {
        transform-origin: 48px 84px;
        animation: splash-flicker 2.4s ease-in-out infinite;
      }
      .splash__logo {
        margin: 6px 0 0;
        font-size: 44px;
        font-weight: 900;
        font-style: italic;
        line-height: 0.95;
        letter-spacing: -0.01em;
        color: #ffd76e;
        text-shadow: 0 3px 5px rgba(20, 10, 4, 0.8);
      }
      .splash__ko {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.32em;
      }
      .splash__slogan {
        margin: 0;
        font-size: 14px;
        color: rgba(246, 241, 231, 0.88);
      }
      .splash__bar {
        position: relative;
        width: 100%;
        height: 8px;
        margin-top: 22px;
        border-radius: 999px;
        background: rgba(246, 241, 231, 0.12);
        box-shadow: inset 0 1px 2px rgba(5, 4, 12, 0.6);
        overflow: hidden;
      }
      .splash__fill {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(to right, #f2b880, #ffc857);
        transform: scaleX(var(--p, 0.04));
        transform-origin: left center;
        transition: transform 0.25s ease-out;
      }
      .splash__note {
        margin: 0;
        font-size: 13px;
        color: rgba(246, 241, 231, 0.82);
      }
      /* 가로로 든 휴대폰처럼 낮은 화면 (2026-11-06): 등불을 왼쪽, 글자를 오른쪽에 나란히 */
      @media (max-height: 520px) and (orientation: landscape) {
        .splash__inner {
          grid-template-columns: auto 1fr;
          grid-template-rows: repeat(6, auto);
          column-gap: 28px;
          row-gap: 8px;
          width: min(84vw, 520px);
          text-align: left;
          justify-items: start;
        }
        .splash__lantern {
          grid-row: 1 / span 6;
          align-self: center;
        }
        .splash__logo {
          font-size: 38px;
        }
        .splash__bar {
          margin-top: 10px;
        }
      }
      @keyframes splash-flicker {
        0%,
        100% {
          transform: scale(1, 1);
          opacity: 1;
        }
        45% {
          transform: scale(0.94, 1.06);
          opacity: 0.88;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash__flame {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="stage" class="stage">
      <div id="game" class="stage__world"></div>
      <div id="ui" class="stage__ui"></div>
    </main>

    <div id="splash" class="splash" role="status" aria-label="라이트 디펜스를 불러오는 중">
      <div class="splash__bg" aria-hidden="true"></div>
      <div class="splash__inner">
        <svg class="splash__lantern" viewBox="0 0 96 132" aria-hidden="true">
          <defs>
            <radialGradient id="splash-glass" cx="50%" cy="60%" r="60%">
              <stop offset="0" stop-color="#FFF4D2" />
              <stop offset=".55" stop-color="#FFC857" />
              <stop offset="1" stop-color="#E08A2E" />
            </radialGradient>
          </defs>
          <path d="M48 6a10 10 0 0 0-10 10v6h20v-6A10 10 0 0 0 48 6Z" fill="none" stroke="#9A6B34" stroke-width="4" />
          <path d="M26 28h44l-6 10H32Z" fill="#9A6B34" />
          <rect x="30" y="38" width="36" height="66" rx="10" fill="url(#splash-glass)" stroke="#5A3E26" stroke-width="4" />
          <path d="M48 40v62M31 70h34" stroke="#5A3E26" stroke-width="3" opacity=".55" />
          <g class="splash__flame">
            <path d="M48 58c7 9 9 15 9 20a9 9 0 0 1-18 0c0-5 2-11 9-20Z" fill="#FFF1C9" />
            <path d="M48 68c3 4 4 7 4 10a4 4 0 0 1-8 0c0-3 1-6 4-10Z" fill="#FF8C5A" />
          </g>
          <path d="M24 104h48l-4 12H28Z" fill="#9A6B34" />
          <rect x="22" y="116" width="52" height="8" rx="3" fill="#5A3E26" />
        </svg>
        <p class="splash__logo">LIGHT<br />DEFENSE</p>
        <span class="splash__ko">라이트 디펜스</span>
        <p class="splash__slogan">작은 빛으로, 마을을 되찾아요.</p>
        <div class="splash__bar" aria-hidden="true"><span class="splash__fill"></span></div>
        <p class="splash__note">등불을 켜는 중…</p>
      </div>
    </div>


    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
