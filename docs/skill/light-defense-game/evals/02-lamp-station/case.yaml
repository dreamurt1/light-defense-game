id: ld-eval-02-lamp-station
title: 등불 스테이션(0.8초 점화, 1.3/s 감소, 결계 200×광도, 켜면 광원 +8) — 순수 TS + Vitest
skill: light-defense-game
prompt: prompt.md
workspace:
  template: ../_template
expect_files:
  - src/systems/LampStation.ts
  - tests/*.test.ts
checks_rules:                     # 스킬 references/gameplay-systems.md '광도'·'등불의 결계', characters.md 토리 특성
  - 꺼진 등불은 빛 한 번에 0.8초 점화 → HP 가득(100) + 중앙 광원 +8
  - 점화 시간 배율(토리 빠른 발 0.5)이 점화 시간에 곱해짐
  - 켜진 동안 저절로 초당 1.3 감소, 적에게 맞으면 광원 피해 × 0.6
  - 켜진 동안 빛을 맞혀도 회복 없음(다시 켤 수 있는 것은 꺼진 뒤)
  - 광도 = HP 비례, 결계 반지름 = 200 × 광도/100
  - HP 0이 되면 꺼짐(한 번 알림)
grade:
  - id: hidden-tests
    type: command
    setup: copy graders/hidden.test.ts -> tests/__hidden__/lamp-station.test.ts
    run: npx vitest run tests/__hidden__
    score: passed_tests / total_tests
    weight: 0.7
  - id: rubric
    type: rubric
    file: graders/rubric.md
    weight: 0.3
timeout_min: 15
