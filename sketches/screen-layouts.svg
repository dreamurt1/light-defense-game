  <text x="745" y="1125" font-size="13" font-weight="700" fill="#f6f1e7" text-anchor="middle">⑦ 보스전 (노월 체력바는 라벤더)</text>

  <!-- 메모 -->
  <g transform="translate(900,620)" font-size="11.5" fill="#c9c6d6">
    <text y="0" font-size="14" font-weight="800" fill="#ffc857">흐름</text>
    <text y="24">홈 → 선택 → 플레이 → 결과</text>
    <text y="44">결과 ‘다시 한 번’ → 선택(직전 선택)</text>
    <text y="64">결과 ‘마을로’ → 홈</text>
    <text y="84">홈 ‘지난 밤들’ → 랭킹, ⚙ → 설정</text>
    <text y="118" font-size="14" font-weight="800" fill="#ffc857">기획서 우선</text>
    <text y="142">· 주인공·악당은 기획서의 동물</text>
    <text y="162">· 재화·레벨·대사 말풍선 없음</text>
    <text y="182">· 상점은 외형만 (M6)</text>
    <text y="202">· 장착물·해금은 M3에 동작</text>
    <text y="222">· 보스 동작은 M2</text>
    <text y="256" font-size="14" font-weight="800" fill="#ffc857">새 문구 (확인 필요)</text>
    <text y="280">· 준비 중</text>
    <text y="300">· 겉모습만 바뀌어요. 능력치는 팔지 않아요.</text>
    <text y="320">· 장착물은 곧 고를 수 있어요</text>
  </g>
</svg>
