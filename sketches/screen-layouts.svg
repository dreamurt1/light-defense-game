    <text x="22" y="186" font-size="16" font-weight="800" fill="#f6f1e7">설정</text>
    <g font-size="11" fill="#f6f1e7">
      <text x="22" y="220">배경음악</text><rect x="210" y="208" width="38" height="18" rx="9" fill="#9ed9b5"/><circle cx="239" cy="217" r="7" fill="#f6f1e7"/>
      <text x="22" y="250">효과음</text><rect x="210" y="238" width="38" height="18" rx="9" fill="#9ed9b5"/><circle cx="239" cy="247" r="7" fill="#f6f1e7"/>
      <text x="22" y="280">진동</text><rect x="210" y="268" width="38" height="18" rx="9" fill="#3a3f6b"/><circle cx="219" cy="277" r="7" fill="#f6f1e7"/>
      <text x="22" y="312">닉네임</text><rect x="22" y="320" width="226" height="28" rx="10" fill="#14152e" stroke="#f6f1e7" stroke-opacity=".3"/><text x="32" y="338" fill="#c9c6d6">이름 없는 등불지기</text>
      <text x="22" y="372">조작</text><rect x="22" y="380" width="226" height="50" rx="10" fill="#14152e"/><circle cx="60" cy="412" r="8" fill="#ffc857"/><path d="M60,412 L100,392 A45,45 0 0 1 100,432 Z" fill="#ffc857" opacity=".6"/><text x="120" y="410" font-size="10" fill="#c9c6d6">막고 싶은 쪽을 탭해요</text>
    </g>
    <rect x="80" y="442" width="110" height="28" rx="14" fill="url(#amber)"/><text x="135" y="460" font-size="11" font-weight="700" fill="#1b1f3b" text-anchor="middle">닫기</text>
  </g>
  <text x="165" y="1125" font-size="13" font-weight="700" fill="#f6f1e7" text-anchor="middle">⑤ 설정</text>

  <!-- 6. 결과 -->
  <g transform="translate(320,620)">
    <use href="#phone"/><rect width="270" height="480" rx="18" fill="#3a2a40" opacity=".5"/>
    <g transform="translate(110,140) scale(1.2)"><use href="#cat"/></g><g transform="translate(150,152)"><use href="#lantern"/></g>
    <rect x="22" y="200" width="226" height="260" rx="18" fill="url(#panel)" stroke="#f2b880" stroke-opacity=".5"/>
    <text x="135" y="236" font-size="17" font-weight="800" fill="#f6f1e7" text-anchor="middle">새벽이 왔어요</text>
    <text x="135" y="254" font-size="9.5" fill="#c9c6d6" text-anchor="middle">등불은 아직 켜져 있어요</text>
    <g font-size="10" fill="#c9c6d6"><text x="40" y="284">되찾은 이웃</text><text x="230" y="284" text-anchor="end" fill="#f6f1e7" font-weight="700">86명</text>
    <text x="40" y="304">오늘 밤 점수</text><text x="230" y="304" text-anchor="end" fill="#ffc857" font-weight="800">12,480</text>
    <text x="40" y="324">최대 콤보</text><text x="230" y="324" text-anchor="end" fill="#f6f1e7" font-weight="700">×24</text>
    <text x="40" y="344">버틴 시간</text><text x="230" y="344" text-anchor="end" fill="#f6f1e7" font-weight="700">02:00</text></g>
    <rect x="40" y="360" width="190" height="28" rx="14" fill="url(#amber)"/><text x="135" y="378" font-size="11" font-weight="700" fill="#1b1f3b" text-anchor="middle">▶ 다시 한 번</text>
    <rect x="40" y="394" width="190" height="26" rx="13" fill="#0f1130" stroke="#f6f1e7" stroke-opacity=".55"/><text x="135" y="411" font-size="10.5" fill="#f6f1e7" text-anchor="middle">마을로</text>
    <rect x="40" y="426" width="190" height="24" rx="12" fill="none" stroke="#f6f1e7" stroke-opacity=".3"/><text x="135" y="442" font-size="10" fill="#c9c6d6" text-anchor="middle">지난 밤들에 남기기</text>
  </g>
  <text x="455" y="1125" font-size="13" font-weight="700" fill="#f6f1e7" text-anchor="middle">⑥ 결과 (클리어 / 오늘 밤은 여기까지)</text>

  <!-- 7. 보스전 -->
