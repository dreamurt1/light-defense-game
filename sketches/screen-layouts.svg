    <use href="#phone"/><rect width="270" height="480" rx="18" fill="#3a2a6b" opacity=".35"/>
    <rect x="0" y="0" width="270" height="40" rx="18" fill="#111228"/>
    <text x="12" y="26" font-size="10" fill="#f6f1e7">☾ 밤 01:48</text><rect x="70" y="18" width="70" height="6" rx="3" fill="#9ed9b5"/><text x="200" y="26" font-size="10" fill="#f6f1e7">점수 56,320</text><text x="262" y="26" font-size="10" fill="#ffc857" text-anchor="end">×8</text>
    <rect x="30" y="52" width="210" height="26" rx="13" fill="#1b1f3b" stroke="#a89cd9" stroke-opacity=".6"/><circle cx="44" cy="65" r="9" fill="#2b1b3d" stroke="#a89cd9"/><text x="60" y="69" font-size="10" fill="#f4d6ff" font-weight="700">노월</text>
    <rect x="92" y="60" width="140" height="10" rx="5" fill="#2b1b3d"/><rect x="92" y="60" width="100" height="10" rx="5" fill="#a89cd9"/>
    <g transform="translate(135,150)"><circle r="60" fill="#a89cd9" opacity=".15"/><path d="M-26,30 L0,-40 L26,30 Z" fill="#2b1b3d"/><path d="M-36,-30 L0,-62 L36,-30 Z" fill="#3a2a5a"/><circle cx="0" cy="-20" r="12" fill="#f4d6ff"/></g>
    <g transform="translate(60,250)"><use href="#bat"/></g><g transform="translate(210,280)"><use href="#bat"/></g>
    <g transform="translate(135,380)"><use href="#lantern"/></g><g transform="translate(110,372) scale(.8)"><use href="#cat"/></g>
    <rect x="0" y="440" width="270" height="40" rx="18" fill="#14152e"/><text x="16" y="466" font-size="12" fill="#ff8a3c">🔥🔥🔥🔥</text><rect x="110" y="455" width="80" height="10" rx="5" fill="#1d1f3d" stroke="#9ed9b5"/><circle cx="245" cy="460" r="12" fill="none" stroke="#f6f1e7"/>
