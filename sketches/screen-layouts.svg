    <g font-size="10" text-anchor="middle"><rect x="14" y="142" width="76" height="26" rx="10" fill="#ffc857"/><text x="52" y="159" fill="#1b1f3b" font-weight="700">스킨</text>
    <rect x="97" y="142" width="76" height="26" rx="10" fill="#1d1f3d"/><text x="135" y="159" fill="#f6f1e7">등불</text>
    <rect x="180" y="142" width="76" height="26" rx="10" fill="#1d1f3d"/><text x="218" y="159" fill="#f6f1e7">빛 색</text></g>
    <g font-size="8.5" fill="#c9c6d6" text-anchor="middle">
      <rect x="14" y="180" width="76" height="100" rx="12" fill="#3a2a1a" stroke="#ffc857" stroke-width="2"/><g transform="translate(52,222) scale(.9)"><use href="#cat"/></g><text x="52" y="262" fill="#f6f1e7">기본</text><text x="52" y="274" fill="#ffc857">장착 중</text>
      <rect x="97" y="180" width="76" height="100" rx="12" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".2"/><text x="135" y="240">준비 중</text>
      <rect x="180" y="180" width="76" height="100" rx="12" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".2"/><text x="218" y="240">준비 중</text>
      <rect x="14" y="290" width="76" height="100" rx="12" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".2"/><text x="52" y="350">준비 중</text>
      <rect x="97" y="290" width="76" height="100" rx="12" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".2"/><text x="135" y="350">준비 중</text>
      <rect x="180" y="290" width="76" height="100" rx="12" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".2"/><text x="218" y="350">준비 중</text>
    </g>
    <text x="135" y="420" font-size="9.5" fill="#c9c6d6" text-anchor="middle">겉모습만 바뀌어요. 능력치는 팔지 않아요.</text>
  </g>
  <text x="745" y="595" font-size="13" font-weight="700" fill="#f6f1e7" text-anchor="middle">③ 상점 (스킨·등불·빛 색, M6)</text>

  <!-- 4. 지난 밤들 -->
  <g transform="translate(900,90)">
    <use href="#phone"/>
    <text x="16" y="30" font-size="16" fill="#f6f1e7">‹</text><text x="135" y="30" font-size="13" font-weight="700" fill="#f6f1e7" text-anchor="middle">지난 밤들</text>
    <g font-size="10" text-anchor="middle"><rect x="14" y="48" width="76" height="26" rx="10" fill="#ffc857"/><text x="52" y="65" fill="#1b1f3b" font-weight="700">오늘</text>
    <rect x="97" y="48" width="76" height="26" rx="10" fill="#1d1f3d"/><text x="135" y="65" fill="#f6f1e7">이번 주</text>
    <rect x="180" y="48" width="76" height="26" rx="10" fill="#1d1f3d"/><text x="218" y="65" fill="#f6f1e7">전체</text></g>
    <g font-size="10" fill="#f6f1e7">
      <rect x="14" y="88" width="242" height="34" rx="10" fill="#232750"/><text x="26" y="110" fill="#ffc857" font-weight="800">1</text><text x="46" y="110">이름 없는 등불지기</text><text x="244" y="110" text-anchor="end" font-weight="700">12,480</text>
      <rect x="14" y="128" width="242" height="34" rx="10" fill="#1d1f3d"/><text x="26" y="150" font-weight="800">2</text><text x="46" y="150">이름 없는 등불지기</text><text x="244" y="150" text-anchor="end">9,320</text>
      <rect x="14" y="168" width="242" height="34" rx="10" fill="#1d1f3d"/><text x="26" y="190" font-weight="800">3</text><text x="46" y="190">이름 없는 등불지기</text><text x="244" y="190" text-anchor="end">7,150</text>
    </g>
    <text x="135" y="300" font-size="10" fill="#c9c6d6" text-anchor="middle">(빈 목록) 아직 남긴 밤이 없어요</text>
    <rect x="14" y="430" width="242" height="34" rx="10" fill="#3a2a1a" stroke="#ffc857"/><text x="26" y="452" font-size="10" fill="#ffc857" font-weight="800">나</text><text x="46" y="452" font-size="10" fill="#f6f1e7">최고 기록 · 2위</text><text x="244" y="452" font-size="10" fill="#f6f1e7" text-anchor="end">9,320</text>
  </g>
  <text x="1035" y="595" font-size="13" font-weight="700" fill="#f6f1e7" text-anchor="middle">④ 지난 밤들 (랭킹)</text>

  <!-- 5. 설정 -->
  <g transform="translate(30,620)">
    <use href="#phone"/><rect width="270" height="480" rx="18" fill="#08061a" opacity=".45"/>
