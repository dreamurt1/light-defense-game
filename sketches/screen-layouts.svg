<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1140" viewBox="0 0 1160 1140" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif">
  <!-- 화면 구성안: UI Screen Sheet의 배치 + 기획서의 문구·구성. 각 화면 270×480 (실제 540×960의 1/2) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f3b"/><stop offset="1" stop-color="#2a2f5a"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd77a"/><stop offset="1" stop-color="#f2ad3f"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffc857" stop-opacity=".55"/><stop offset="1" stop-color="#ffc857" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232750"/><stop offset="1" stop-color="#191c3d"/></linearGradient>
    <g id="cat">
      <ellipse cx="0" cy="18" rx="15" ry="16" fill="#16131f"/><circle cx="0" cy="-8" r="13" fill="#16131f"/>
      <path d="M-12,-11 L-9,-27 L-2,-17 Z M12,-11 L9,-27 L2,-17 Z" fill="#16131f"/>
      <circle cx="-5" cy="-8" r="2.4" fill="#9ed9b5"/><circle cx="5" cy="-8" r="2.4" fill="#9ed9b5"/>
      <rect x="-14" y="2" width="28" height="7" rx="3.5" fill="#f7955e"/><path d="M-10,8 L-14,20 L-6,17 Z" fill="#f7955e"/>
    </g>
    <g id="lantern"><circle r="34" fill="url(#glow)"/><rect x="-8" y="-12" width="16" height="22" rx="4" fill="#ffd27a" stroke="#9a6b34" stroke-width="2"/><path d="M-11,-12 L0,-22 L11,-12 Z" fill="#7a5530"/><rect x="-9" y="10" width="18" height="5" fill="#7a5530"/></g>
    <g id="bat"><circle r="9" fill="#14111f"/><path d="M-6,-4 L-16,-10 L-12,2 Z M6,-4 L16,-10 L12,2 Z" fill="#1b1729"/><circle cx="-3" cy="-1" r="1.6" fill="#c9bcff"/><circle cx="3" cy="-1" r="1.6" fill="#c9bcff"/></g>
    <g id="phone"><rect width="270" height="480" rx="18" fill="url(#sky)" stroke="#3a3f6b" stroke-width="2"/></g>
  </defs>
  <rect width="1160" height="1140" fill="#0f1130"/>
  <text x="30" y="40" font-size="22" font-weight="800" fill="#ffc857">라이트 디펜스 · 화면 구성안</text>
  <text x="30" y="64" font-size="13" fill="#c9c6d6">UI Screen Sheet의 배치 + 기획서의 문구·구성 (기획서 우선). 실제 화면은 540×960, 여기선 절반 크기</text>

  <!-- 1. 홈 -->
  <g transform="translate(30,90)">
    <use href="#phone"/>
    <path d="M0,330 Q60,300 120,320 Q190,345 270,310 L270,462 Q270,480 252,480 L18,480 Q0,480 0,462 Z" fill="#241f3a"/>
    <rect x="18" y="200" width="70" height="60" fill="#2c2440"/><rect x="40" y="215" width="16" height="20" rx="8" fill="#ffc857"/>
    <circle cx="230" cy="70" r="12" fill="#f6f1e7" opacity=".9"/><circle cx="236" cy="66" r="11" fill="#1b1f3b"/>
    <text x="24" y="70" font-size="25" font-weight="900" fill="#ffd76e">LIGHT</text><text x="24" y="98" font-size="25" font-weight="900" fill="#ffd76e">DEFENSE</text>
    <text x="26" y="118" font-size="11" fill="#f6f1e7">— 라이트 디펜스 —</text>
    <text x="26" y="136" font-size="9.5" fill="#c9c6d6">탭 한 번, 빛 한 줄기. 오늘 밤도 끝까지.</text>
    <circle cx="246" cy="22" r="11" fill="none" stroke="#f6f1e7" stroke-width="1.5"/><text x="241" y="26" font-size="11" fill="#f6f1e7">⚙</text>
    <g transform="translate(62,388) scale(1.5)"><use href="#cat"/></g><g transform="translate(108,400)"><use href="#lantern"/></g>
    <rect x="150" y="300" width="106" height="30" rx="15" fill="url(#amber)"/><text x="203" y="320" font-size="11" font-weight="700" fill="#1b1f3b" text-anchor="middle">▶ 오늘 밤 등불지기</text>
    <rect x="150" y="338" width="106" height="26" rx="13" fill="#0f1130" stroke="#f6f1e7" stroke-opacity=".55"/><text x="203" y="355" font-size="10.5" fill="#f6f1e7" text-anchor="middle">지난 밤들</text>
    <rect x="150" y="370" width="106" height="26" rx="13" fill="#0f1130" stroke="#f6f1e7" stroke-opacity=".55"/><text x="203" y="387" font-size="10.5" fill="#f6f1e7" text-anchor="middle">상점</text>
    <rect x="12" y="446" width="140" height="24" rx="12" fill="#14152e" stroke="#f6f1e7" stroke-opacity=".2"/><circle cx="25" cy="458" r="8" fill="#16131f" stroke="#f7955e"/><text x="38" y="462" font-size="9.5" fill="#f6f1e7">이름 없는 등불지기</text>
  </g>
  <text x="165" y="595" font-size="13" font-weight="700" fill="#f6f1e7" text-anchor="middle">① 홈 (엔트리)</text>

  <!-- 2. 캐릭터 선택 -->
  <g transform="translate(320,90)">
    <use href="#phone"/>
    <text x="16" y="30" font-size="16" fill="#f6f1e7">‹</text><text x="135" y="30" font-size="13" font-weight="700" fill="#f6f1e7" text-anchor="middle">등불지기</text>
    <path d="M55,200 L55,110 A80,80 0 0 1 215,110 L215,200 Z" fill="#2a2f5a" stroke="#a89cd9" stroke-opacity=".5"/>
    <g transform="translate(135,150) scale(2.2)"><use href="#cat"/></g>
    <text x="30" y="158" font-size="20" fill="#ffc857">‹</text><text x="232" y="158" font-size="20" fill="#ffc857">›</text>
    <text x="135" y="228" font-size="16" font-weight="800" fill="#f6f1e7" text-anchor="middle">루미 <tspan font-size="10" fill="#c9c6d6">Lumi</tspan></text>
    <text x="135" y="245" font-size="9.5" fill="#c9c6d6" text-anchor="middle">어둠 속도 잘 보여요. 처음이라면 루미.</text>
    <text x="135" y="264" font-size="9.5" fill="#f2b880" text-anchor="middle">사거리 220 · 위력 10 · 밤눈</text>
    <g font-size="8" fill="#c9c6d6" text-anchor="middle">
      <rect x="16" y="278" width="44" height="50" rx="9" fill="#3a2a1a" stroke="#ffc857" stroke-width="2"/><g transform="translate(38,300) scale(.7)"><use href="#cat"/></g>
      <rect x="66" y="278" width="44" height="50" rx="9" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".25"/><text x="88" y="306">🔒</text><text x="88" y="322">3판</text>
      <rect x="116" y="278" width="44" height="50" rx="9" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".25"/><text x="138" y="322">아이템 50</text>
      <rect x="166" y="278" width="44" height="50" rx="9" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".25"/><text x="188" y="322">10분</text>
      <rect x="216" y="278" width="44" height="50" rx="9" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".25"/><text x="238" y="322">콤보 30</text>
    </g>
    <text x="16" y="350" font-size="10" font-weight="700" fill="#f6f1e7">장착물</text>
    <g font-size="7.5" fill="#c9c6d6" text-anchor="middle">
      <rect x="16" y="358" width="56" height="40" rx="9" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".25"/><text x="44" y="382">느림 가루</text>
      <rect x="78" y="358" width="56" height="40" rx="9" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".25"/><text x="106" y="382">바람 신발</text>
      <rect x="140" y="358" width="56" height="40" rx="9" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".25"/><text x="168" y="382">따뜻한 목도리</text>
      <rect x="202" y="358" width="56" height="40" rx="9" fill="#1d1f3d" stroke="#f6f1e7" stroke-opacity=".25"/><text x="230" y="382">별 목걸이</text>
    </g>
    <rect x="45" y="420" width="180" height="34" rx="17" fill="url(#amber)"/><text x="135" y="442" font-size="12" font-weight="700" fill="#1b1f3b" text-anchor="middle">등불을 켜요</text>
  </g>
  <text x="455" y="595" font-size="13" font-weight="700" fill="#f6f1e7" text-anchor="middle">② 캐릭터·장착물 선택</text>

  <!-- 3. 상점 -->
  <g transform="translate(610,90)">
    <use href="#phone"/>
    <rect x="0" y="0" width="270" height="130" rx="18" fill="#2c2238"/><rect x="0" y="100" width="270" height="30" fill="#3a2a2a"/>
    <g fill="#5a3e26"><rect x="20" y="40" width="230" height="5"/><rect x="20" y="75" width="230" height="5"/></g>
    <g transform="translate(60,62) scale(.6)"><use href="#lantern"/></g><g transform="translate(200,62) scale(.6)"><use href="#lantern"/></g>
